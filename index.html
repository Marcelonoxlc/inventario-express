<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inventario Carnicería</title>

<style>
body {
  margin: 0;
  padding: 0;
  background: white;
}

.ticket {
  background: white;
  margin: 0;
  padding: 0;
  box-shadow: none;
  width: 300px;
}
  
h1 {
  text-align: center;
  margin-bottom: 20px;
}

.card {
  background: #fff;
  padding: 16px;
  border-radius: 8px;
  margin-bottom: 16px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

label {
  display: block;
  font-weight: 600;
  margin-top: 12px;
  margin-bottom: 4px;
}

input, select, button {
  width: 100%;
  padding: 10px;
  font-size: 16px;
  margin-bottom: 10px;
}

button {
  background: #111;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

ul {
  list-style: none;
  padding: 0;
  margin: 0;
}

li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid #eee;
}

.remove {
  background: #c62828;
  padding: 6px 10px;
  font-size: 14px;
  width: 3em;
  margin-left: 10px;
}

#resetBtn {
  background: #444;
}

#sugerencias {
  border: 1px solid #ddd;
  border-radius: 6px;
  max-height: 150px;
  overflow-y: auto;
}

#sugerencias li {
  padding: 8px;
  cursor: pointer;
}

#sugerencias li:hover {
  background: #eee;
}
</style>
</head>

<body>

<h1>Inventario</h1>

<div class="card">
<label>Producto</label>
<input type="text" id="productoInput" placeholder="Escribe para buscar..." />
<ul id="sugerencias"></ul>

<label>Unidad</label>
<select id="unidadSelect">
  <option value="unidad">Unidad</option>
  <option value="kilos">Kilos</option>
  <option value="bandeja">Bandeja</option>
  <option value="pieza">Pieza</option>
  <option value="bolsa">Bolsa</option>
</select>

<label>Cantidad</label>
<input type="number" id="cantidadInput" step="0.01" placeholder="Ej: 2 o 3.5" />

<button id="agregarBtn">Agregar a la lista</button>
</div>

<div class="card">
<h3>Lista de inventario</h3>
<ul id="listaInventario"></ul>
</div>

<div class="card">
<button id="descargarBtn">Generar Ticket (PNG + PDF)</button>
<button id="resetBtn">Resetear Inventario</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<script>
const productos = [
"Arvejas 200gr","Arerjas 1kg","Cebolla cubo 150gr","Champiñones 500gr","Choclo grano 1kg",
"Choclo grano 200gr","Choclo trozo 200gr","Crocante de pollo","Habas 500gr",
"Hamb. Crianza pollo","Hamb. Crianza soya","Hamb. Crianza vacuno","Hamb. King pollo",
"Hamb. King vacuno","Hamb. Mastodonte","Hamb. King kong","Nugguets pollo 400gr",
"Papas americanas french 1kg","Papas americanas french 2.5kg","Papas duquesas 1kg",
"Papas prefritas 1kg","Pasta de choclo 1kg","Porotos granados 500gr",
"Porotos verdes 150gr","Primavera 1kg","Chapsui 500gr","Surtido de marisco",
"Sofritos","Zapallo cubo","Abastero","Asiento","Carnicero","Choclillo","Entraña",
"Filete","Ganso","Huachalomo","Lomo liso","Lomo vetado","Palanca","Plateada",
"Pollo ganso","Posta negra","Posta paleta","Posta rosada","Punta de ganso",
"Punta paleta","Punta picana","Punta de ganao","Sobrecostilla","Tapabarriga",
"Tapapecho","Molida corriente","Molida especial","Guata","Corazon de vacuno",
"Pana de vacuno","Pata de vacuno","Lengua de vacuno","Ubre","Chunchules",
"Cauela cogote","Aletilla","Asado de tira","Cola de vacuno","Coluda",
"Osobuco","Hueso carnudo","Trutro entero","Trutro de ala","Pollo entero",
"Pechuga entera","Pechuga deshesada de pollo","Aviones","Patas de pollo",
"Contre","Pana de pollo","Cogote de pollo","Corazon de pollo",
"Costillar de cerdo","Chuleta de centro","Chuleta vetada","Pulpa deshuesada",
"Pulpa con hueso","Paleta de cerdo","Cazuela de cerdo","Lomo de cerdo",
"Pernil mano","Manítos de cerdo","Panceta de cerdo","Manteca de cerdo",
"Cuero de cerdo","Cabeza de cero","Longaniza de chillan",
"Longaniza dña maria","Prietas","Chorizos"
];

let inventario = JSON.parse(localStorage.getItem("inventario")) || [];

const productoInput = document.getElementById("productoInput");
const sugerencias = document.getElementById("sugerencias");
const unidadSelect = document.getElementById("unidadSelect");
const cantidadInput = document.getElementById("cantidadInput");
const agregarBtn = document.getElementById("agregarBtn");
const listaInventario = document.getElementById("listaInventario");
const descargarBtn = document.getElementById("descargarBtn");
const resetBtn = document.getElementById("resetBtn");

function guardarInventario() {
  localStorage.setItem("inventario", JSON.stringify(inventario));
}

productoInput.addEventListener("input", () => {
  const texto = productoInput.value.toLowerCase();
  sugerencias.innerHTML = "";
  if (texto === "") return;

  productos.filter(p => p.toLowerCase().includes(texto))
  .forEach(producto => {
    const li = document.createElement("li");
    li.textContent = producto;
    li.onclick = () => {
      productoInput.value = producto;
      sugerencias.innerHTML = "";
    };
    sugerencias.appendChild(li);
  });
});

agregarBtn.addEventListener("click", () => {
  const producto = productoInput.value.trim();
  const unidad = unidadSelect.value;
  const cantidad = parseFloat(cantidadInput.value);

  if (!producto || isNaN(cantidad) || cantidad <= 0) {
    alert("Completa correctamente el producto y la cantidad");
    return;
  }

  inventario.push({ producto, unidad, cantidad });
  guardarInventario();
  renderInventario();
  productoInput.value = "";
  cantidadInput.value = "";
  sugerencias.innerHTML = "";
});

function renderInventario() {
  listaInventario.innerHTML = "";
  inventario.forEach((item, index) => {
    const li = document.createElement("li");
    li.innerHTML = `<span>${item.producto} - ${item.cantidad} ${item.unidad}</span>
    <button class="remove">❌</button>`;
    li.querySelector(".remove").onclick = () => {
      inventario.splice(index, 1);
      guardarInventario();
      renderInventario();
    };
    listaInventario.appendChild(li);
  });
}

renderInventario();

descargarBtn.addEventListener("click", async () => {
  if (inventario.length === 0) {
    alert("No hay productos");
    return;
  }
  await generarZIP();
  generarPDFRespaldo();
});

function dividirEnPaginas(array, tamaño) {
  const paginas = [];
  for (let i = 0; i < array.length; i += tamaño) {
    paginas.push(array.slice(i, i + tamaño));
  }
  return paginas;
}

async function generarZIP() {
  const paginas = dividirEnPaginas(inventario, 10);
  const fecha = new Date().toISOString().slice(0,10);
  const zip = new JSZip();

  for (let i = 0; i < paginas.length; i++) {
    const canvas = generarCanvasTicket(paginas[i], i + 1);
    const base64 = canvas.toDataURL("image/png").split(",")[1];
    zip.file(`inventario_${fecha}_${i+1}.png`, base64, {base64:true});
  }

  const contenido = await zip.generateAsync({type:"blob"});
  saveAs(contenido, `inventario_${fecha}.zip`);
}

function generarCanvasTicket(items, numeroPagina) {
  const ancho = 384;
  const padding = 20;
  const fontSize = 24;
  const lineHeight = 32;

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  ctx.font = `${fontSize}px monospace`;

  let altura = padding*2 + 100 + items.length * lineHeight * 3;
  canvas.width = ancho;
  canvas.height = altura;

  ctx.fillStyle = "#fff";
  ctx.fillRect(0,0,ancho,altura);

  ctx.fillStyle = "#000";
  ctx.font = `bold ${fontSize}px monospace`;
  ctx.textAlign = "center";

  let y = padding + fontSize;
  ctx.fillText(`INVENTARIO - Pag ${numeroPagina}`, ancho/2, y);

  ctx.textAlign = "left";
  ctx.font = `${fontSize}px monospace`;
  y += lineHeight;

  items.forEach(item => {
    ctx.fillText(`${item.producto} - ${item.cantidad} ${item.unidad}`, padding, y);
    y += lineHeight;
    ctx.fillText("--------------------------------", padding, y);
    y += lineHeight;
  });

  return canvas;
}

function generarPDFRespaldo() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 20;
  doc.setFont("courier");
  doc.text("INVENTARIO COMPLETO", 20, y);
  y += 10;

  inventario.forEach(item => {
    doc.text(`${item.producto} - ${item.cantidad} ${item.unidad}`, 20, y);
    y += 8;
    if (y > 280) {
      doc.addPage();
      y = 20;
    }
  });

  doc.save("inventario_respaldo.pdf");
}

resetBtn.addEventListener("click", () => {
  if (confirm("¿Seguro que deseas borrar el inventario?")) {
    inventario = [];
    guardarInventario();
    renderInventario();
  }
});
</script>

</body>
</html>
