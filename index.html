<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inventario Carnicería</title>

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding: 16px;
}

h1 {
  text-align: center;
  margin-bottom: 20px;
}

.card {
  background: #fff;
  padding: 16px;
  border-radius: 8px;
  margin-bottom: 16px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

label {
  display: block;
  font-weight: 600;
  margin-top: 12px;
  margin-bottom: 4px;
}

input, select, button {
  width: 100%;
  padding: 10px;
  font-size: 16px;
  margin-bottom: 10px;
}

button {
  background: #111;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

ul {
  list-style: none;
  padding: 0;
  margin: 0;
}

li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid #eee;
}

.remove {
  background: #c62828;
  padding: 6px 10px;
  font-size: 14px;
  width: 3em;
  margin-left: 10px;
}

#resetBtn {
  background: #444;
}

#sugerencias {
  border: 1px solid #ddd;
  border-radius: 6px;
  max-height: 150px;
  overflow-y: auto;
}

#sugerencias li {
  padding: 8px;
  cursor: pointer;
}

#sugerencias li:hover {
  background: #eee;
}
</style>
</head>

<body>

<h1>Inventario</h1>

<div class="card">
<label>Producto</label>
<input type="text" id="productoInput" placeholder="Escribe para buscar..." />
<ul id="sugerencias"></ul>

<label>Unidad</label>
<select id="unidadSelect">
  <option value="unidad">Unidad</option>
  <option value="kilos">Kilos</option>
  <option value="bandeja">Bandeja</option>
  <option value="pieza">Pieza</option>
  <option value="bolsa">Bolsa</option>
</select>

<label>Cantidad</label>
<input type="number" id="cantidadInput" step="0.01" placeholder="Ej: 2 o 3.5" />

<button id="agregarBtn">Agregar a la lista</button>
</div>

<div class="card">
<h3>Lista de inventario</h3>
<ul id="listaInventario"></ul>
</div>

<div class="card">
<button id="descargarBtn">Generar Ticket (PNG + PDF)</button>
<button id="resetBtn">Resetear Inventario</button>
</div>

<!-- jsPDF CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
/**********************
 * DATOS
 **********************/
const productos = [ /* TU ARRAY ORIGINAL COMPLETO AQUÍ (sin cambios) */ ];

let inventario = JSON.parse(localStorage.getItem("inventario")) || [];

const productoInput = document.getElementById("productoInput");
const sugerencias = document.getElementById("sugerencias");
const unidadSelect = document.getElementById("unidadSelect");
const cantidadInput = document.getElementById("cantidadInput");
const agregarBtn = document.getElementById("agregarBtn");
const listaInventario = document.getElementById("listaInventario");
const descargarBtn = document.getElementById("descargarBtn");
const resetBtn = document.getElementById("resetBtn");

/**********************
 * GUARDAR EN LOCALSTORAGE
 **********************/
function guardarInventario() {
  localStorage.setItem("inventario", JSON.stringify(inventario));
}

/**********************
 * FILTRO
 **********************/
productoInput.addEventListener("input", () => {
  const texto = productoInput.value.toLowerCase();
  sugerencias.innerHTML = "";

  if (texto === "") return;

  productos
    .filter(p => p.toLowerCase().includes(texto))
    .forEach(producto => {
      const li = document.createElement("li");
      li.textContent = producto;
      li.addEventListener("click", () => {
        productoInput.value = producto;
        sugerencias.innerHTML = "";
      });
      sugerencias.appendChild(li);
    });
});

/**********************
 * AGREGAR
 **********************/
agregarBtn.addEventListener("click", () => {
  const producto = productoInput.value.trim();
  const unidad = unidadSelect.value;
  const cantidad = parseFloat(cantidadInput.value);

  if (!producto || isNaN(cantidad) || cantidad <= 0) {
    alert("Completa correctamente el producto y la cantidad");
    return;
  }

  inventario.push({ producto, unidad, cantidad });
  guardarInventario();
  renderInventario();

  productoInput.value = "";
  cantidadInput.value = "";
  sugerencias.innerHTML = "";
});

/**********************
 * RENDER
 **********************/
function renderInventario() {
  listaInventario.innerHTML = "";

  inventario.forEach((item, index) => {
    const li = document.createElement("li");

    li.innerHTML = `
      <span>${item.producto} - ${item.cantidad} ${item.unidad}</span>
      <button class="remove">❌</button>
    `;

    li.querySelector(".remove").addEventListener("click", () => {
      inventario.splice(index, 1);
      guardarInventario();
      renderInventario();
    });

    listaInventario.appendChild(li);
  });
}

renderInventario();

/**********************
 * GENERAR PNG PAGINADO
 **********************/
descargarBtn.addEventListener("click", async () => {
  if (inventario.length === 0) {
    alert("No hay productos");
    return;
  }

  await generarPNGsPaginados();
  generarPDFRespaldo();
});

function dividirEnPaginas(array, tamaño) {
  const paginas = [];
  for (let i = 0; i < array.length; i += tamaño) {
    paginas.push(array.slice(i, i + tamaño));
  }
  return paginas;
}

async function generarPNGsPaginados() {
  const paginas = dividirEnPaginas(inventario, 10);
  const fecha = new Date().toISOString().slice(0,10);

  for (let i = 0; i < paginas.length; i++) {
    generarImagenTicket(paginas[i], i + 1, fecha);
    await new Promise(resolve => setTimeout(resolve, 400));
  }
}

function generarImagenTicket(items, numeroPagina, fecha) {
  const ancho = 384;
  const padding = 20;
  const fontSize = 24;
  const lineHeight = 32;

  const canvasTemp = document.createElement("canvas");
  const ctxTemp = canvasTemp.getContext("2d");
  ctxTemp.font = `${fontSize}px monospace`;

  let alturaNecesaria = padding * 2 + 100;

  items.forEach(item => {
    const texto = `${item.producto} - ${item.cantidad} ${item.unidad}`;
    const palabras = texto.split(" ");
    let linea = "";
    palabras.forEach(p => {
      const test = linea + p + " ";
      if (ctxTemp.measureText(test).width > ancho - padding*2) {
        alturaNecesaria += lineHeight;
        linea = p + " ";
      } else {
        linea = test;
      }
    });
    alturaNecesaria += lineHeight * 2; // texto + separador
  });

  const canvas = document.createElement("canvas");
  canvas.width = ancho;
  canvas.height = alturaNecesaria;

  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#fff";
  ctx.fillRect(0,0,ancho,alturaNecesaria);

  ctx.fillStyle = "#000";
  ctx.font = `bold ${fontSize}px monospace`;
  ctx.textAlign = "center";

  let y = padding + fontSize;
  ctx.fillText(`INVENTARIO - Pag ${numeroPagina}`, ancho/2, y);

  ctx.textAlign = "left";
  ctx.font = `${fontSize}px monospace`;
  y += lineHeight;

  items.forEach(item => {
    const texto = `${item.producto} - ${item.cantidad} ${item.unidad}`;
    y = drawTextWrapped(ctx, texto, padding, y, ancho - padding*2, lineHeight);
    ctx.fillText("--------------------------------", padding, y);
    y += lineHeight;
  });

  const link = document.createElement("a");
  link.download = `inventario_${fecha}_${numeroPagina}.png`;
  link.href = canvas.toDataURL("image/png");
  link.click();
}

function drawTextWrapped(ctx, text, x, y, maxWidth, lineHeight) {
  const words = text.split(" ");
  let line = "";

  for (let i = 0; i < words.length; i++) {
    const testLine = line + words[i] + " ";
    if (ctx.measureText(testLine).width > maxWidth && i > 0) {
      ctx.fillText(line, x, y);
      line = words[i] + " ";
      y += lineHeight;
    } else {
      line = testLine;
    }
  }

  ctx.fillText(line, x, y);
  return y + lineHeight;
}

/**********************
 * PDF RESPALDO
 **********************/
function generarPDFRespaldo() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  let y = 20;
  doc.setFont("courier");

  doc.text("INVENTARIO COMPLETO", 20, y);
  y += 10;

  inventario.forEach(item => {
    const texto = `${item.producto} - ${item.cantidad} ${item.unidad}`;
    doc.text(texto, 20, y);
    y += 8;

    if (y > 280) {
      doc.addPage();
      y = 20;
    }
  });

  doc.save("inventario_respaldo.pdf");
}

/**********************
 * RESET
 **********************/
resetBtn.addEventListener("click", () => {
  if (confirm("¿Seguro que deseas borrar el inventario?")) {
    inventario = [];
    guardarInventario();
    renderInventario();
  }
});
</script>

</body>
</html>
